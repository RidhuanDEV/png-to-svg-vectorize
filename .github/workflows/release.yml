name: Release

# Builds the desktop app for Windows (x64) and macOS (arm64 + Intel), runs a smoke test on each build, and
# creates a DRAFT GitHub release for tags v*. Publishing the draft is a manual decision.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, optional: false }
          - { os: macos-14, arch: arm64, optional: false }
          - { os: macos-15-intel, arch: x64, optional: true }   # Intel runners are being phased out
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Build UI
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Install pinned build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
          pip install --no-deps .

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import pngsvg; print(pngsvg.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/pngsvg.spec

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/PNG to SVG Vectorize/PNG to SVG Vectorize.exe" -ArgumentList "--smoke" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/PNG to SVG Vectorize/app.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/PNG to SVG Vectorize.app/Contents/MacOS/PNG to SVG Vectorize" --smoke

      - name: Windows installer + portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" packaging\windows\installer.iss
          Compress-Archive -Path "dist/PNG to SVG Vectorize" -DestinationPath "dist/PNG-to-SVG-Vectorize-${{ steps.v.outputs.version }}-windows-x64-portable.zip"

      - name: macOS DMG
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh "${{ steps.v.outputs.version }}" "${{ matrix.arch }}"

      - name: Bundle size
        shell: bash
        run: du -sh dist/* | sort -h

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --title "PNG to SVG Vectorize ${GITHUB_REF_NAME}" --notes-file "$notes"
