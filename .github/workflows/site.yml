name: Website

# Product website (site/, Next.js static export) on GitHub Pages:
# https://ridhuandev.github.io/png-to-svg-vectorize/
# Rebuilt when its sources change and after every published release (download links, sizes, checksums).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/user-guide.*.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "app/ui/src/theme/themes.json"
      - "app/ui/public/favicon.svg"
      - "assets/icons/**"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      GITHUB_TOKEN: ${{ github.token }}     # scripts/content.mjs reads the latest release through the API
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
