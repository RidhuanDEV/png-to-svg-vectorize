name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,app]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          png2svg --help
          png2svg serve --help

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: pip install -e "../..[app]"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/ui/test-results
          retention-days: 7

  bench:
    # quality regression on the license-free comparison set (E7) and the synthetic set:
    # fails when similarity drops by more than 0.3 points or a file grows by more than 10 %
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Download comparison set (verified by SHA-256)
        run: python bench/fetch_sets.py
      - name: Comparison set
        run: python bench/run.py --images bench/sets/images --name ci-sets --jobs 4 --baseline bench/baseline-sets.json
      - name: Synthetic set
        if: always()
        run: |
          python bench/synthetic.py
          python bench/run.py --name ci-synthetic --jobs 4 --baseline bench/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results
          retention-days: 14
